[project]
name = "goodsng-backend"
version = "0.1.0"
description = "Goods.ng marketplace API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "redis>=5.0",
    "httpx>=0.27",
    "cryptography>=42",
    "nh3>=0.2.17",
    "python-slugify>=8.0",
    "segno>=1.6.6",
    "boto3>=1.43.125",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
